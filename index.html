<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth By Tamz 🎀 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fdf2f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .pink-gradient { background: linear-gradient(135deg, #fbcfe8, #f9a8d4); }
        .video-box { 
            transform: scaleX(-1); 
        }
        .photo-card.selected {
            border: 4px solid #ec4899 !important;
            transform: scale(0.95);
            box-shadow: 0 10px 15px -3px rgba(236, 72, 153, 0.4);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white p-6 rounded-3xl shadow-2xl border-4 border-pink-200 text-center">
        <h1 class="text-3xl font-bold text-pink-500 mb-1 tracking-tight">Photobooth By Tamz ✨</h1>
        <p class="text-xs text-pink-400 mb-4">Ambil 12 Foto, Pilih Favoritmu & Kreasikan Kolasenya!</p>
        
        <!-- STEP 1: PENGATURAN KAMERA & LAYOUT -->
        <div id="setup-section" class="text-left">
            <div class="mb-3">
                <label class="block text-xs font-semibold text-pink-600 mb-1">Pilih Jumlah Bingkai Kolase:</label>
                <select id="layout-select" class="w-full p-2.5 rounded-xl border border-pink-200 text-pink-600 bg-pink-50/50 text-sm focus:outline-none">
                    <option value="4">Grid 4 Foto (Classic Strip)</option>
                    <option value="6">Grid 6 Foto (Extended Strip)</option>
                    <option value="8">Grid 8 Foto (Mega Booth)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="block text-xs font-semibold text-pink-600 mb-1">Pilih Filter Kamera:</label>
                <select id="filter-select" class="w-full p-2.5 rounded-xl border border-pink-200 text-pink-600 bg-pink-50/50 text-sm focus:outline-none">
                    <option value="none">Normal (Natural)</option>
                    <option value="sepia(40%)">Vintage Warm</option>
                    <option value="grayscale(100%)">Classic B&W</option>
                    <option value="brightness(110%) saturate(140%)">Cute Bright ✨</option>
                </select>
            </div>

            <!-- Area Live Preview Kamera -->
            <div class="relative overflow-hidden rounded-2xl bg-gray-900 aspect-[3/4] mb-4 shadow-inner flex items-center justify-center">
                <video id="video" autoplay playsinline muted class="w-full h-full object-cover video-box"></video>
                <div id="countdown" class="absolute inset-0 flex items-center justify-center text-7xl font-black text-white drop-shadow-md hidden bg-pink-500/40 backdrop-blur-[2px]">3</div>
                <div id="shoot-counter" class="absolute top-3 right-3 bg-pink-500 text-white text-xs px-3 py-1 rounded-full font-bold shadow hidden">Foto ke-1 / 12</div>
            </div>

            <button id="start-btn" onclick="startPhotoSession()" class="w-full pink-gradient hover:opacity-90 text-white font-bold py-4 rounded-2xl transition shadow-lg text-lg">
                Mulai 12x Jepret Foto 📸
            </button>
        </div>

        <!-- STEP 2: PILIH FOTO (SELECTION GALLERY) -->
        <div id="selection-section" class="hidden text-left">
            <div class="bg-pink-50 p-3 rounded-2xl border border-pink-100 mb-3">
                <h2 class="text-sm font-bold text-pink-600 text-center">Pilih Foto Favoritmu! 💖</h2>
                <p class="text-[11px] text-pink-400 text-center mb-2">Pilih tepat <span id="target-count" class="font-bold">4</span> foto dari 12 jepretan.</p>
                
                <!-- Grid 12 Foto Hasil Jepretan -->
                <div id="photos-grid" class="grid grid-cols-3 gap-2 max-h-72 overflow-y-auto p-1 bg-white rounded-xl border border-pink-100">
                    <!-- Dynamic generated photos -->
                </div>
            </div>

            <button id="generate-collage-btn" onclick="generateCollage()" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-3 rounded-xl transition shadow text-sm mb-2 cursor-not-allowed">
                Buat Kolase Sekarang ✨
            </button>
            <button onclick="restartSession()" class="w-full text-xs text-pink-400 hover:text-pink-600 py-1 underline text-center block">
                Ulangi Sesi Foto
            </button>
        </div>

        <!-- STEP 3: HASIL KOLASE & EDITING AKHIR -->
        <div id="edit-area" class="hidden text-left">
            <h2 class="text-md font-bold text-pink-500 mb-2 text-center">Atur Warna & Asesoris 🎨</h2>
            
            <div class="mb-2">
                <label class="block text-xs font-semibold text-pink-600 mb-1">Pilih Warna Background:</label>
                <select id="bg-color-select" onchange="updatePreview()" class="w-full p-2.5 rounded-xl border border-pink-200 text-pink-600 bg-pink-50/50 text-sm focus:outline-none">
                    <option value="#fdf2f8">Soft Pink (Default)</option>
                    <option value="#fef08a">Yellow (Kuning Ceria)</option>
                    <option value="#bbf7d0">Green (Mint Hijau)</option>
                    <option value="#fecdd3">Pink Manis</option>
                    <option value="#fed7aa">Orange Hangat</option>
                    <option value="#e9d5ff">Purple (Ungu Muda)</option>
                    <option value="#bae6fd">Sky Blue (Biru Langit)</option>
                    <option value="#1e3a8a">Galaxy Blue (Biru Dongker)</option>
                    <option value="#9ca3af">Grey (Abu Elegan)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="block text-xs font-semibold text-pink-600 mb-1">Tambah Asesoris/Stiker:</label>
                <select id="accessory-select" onchange="updatePreview()" class="w-full p-2.5 rounded-xl border border-pink-200 text-pink-600 bg-pink-50/50 text-sm focus:outline-none">
                    <option value="ribbon">Pita, Hati & Cinta (🎀 💖 ✨)</option>
                    <option value="stars">Bintang & Kilau (⭐ 💫)</option>
                    <option value="flowers">Bunga & Tulip (🌸 🌷)</option>
                    <option value="kiss">Stiker Bibir & Cupid (💋 💘)</option>
                    <option value="none">Tanpa Stiker</option>
                </select>
            </div>

            <div class="bg-pink-50 p-2 rounded-2xl border border-pink-200 mb-3 flex justify-center">
                <img id="final-image" class="max-h-64 rounded-xl shadow-md border border-pink-100 object-contain">
            </div>

            <a id="download-link" class="block w-full bg-pink-500 text-white py-3 rounded-xl font-bold hover:bg-pink-600 transition shadow-md text-center mb-2">
                Download Hasil Foto 🎀
            </a>
            <button onclick="backToSelection()" class="w-full text-xs text-pink-400 hover:text-pink-600 py-1 underline text-center block">
                Pilih Ulang Foto
            </button>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('video');
        const countdownEl = document.getElementById('countdown');
        const shootCounter = document.getElementById('shoot-counter');
        const startBtn = document.getElementById('start-btn');
        const setupSection = document.getElementById('setup-section');
        const selectionSection = document.getElementById('selection-section');
        const editArea = document.getElementById('edit-area');
        const layoutSelect = document.getElementById('layout-select');
        const photosGrid = document.getElementById('photos-grid');
        const targetCountEl = document.getElementById('target-count');
        const generateCollageBtn = document.getElementById('generate-collage-btn');
        const finalImage = document.getElementById('final-image');
        const downloadLink = document.getElementById('download-link');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let allCapturedPhotos = [];
        let selectedIndices = [];
        let currentStream = null;

        // Inisialisasi Kamera Depan HP
        async function initCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = currentStream;
            } catch (err) {
                alert("Mohon izinkan akses kamera di browser Anda (Pastikan buka lewat HTTPS/GitHub). Error: " + err.message);
            }
        }

        // Jalankan kamera pas halaman kebuka
        initCamera();

        // 12 Kali Jepret Beruntun
        async function startPhotoSession() {
            startBtn.disabled = true;
            startBtn.textContent = "Bersiap ya... 💖";
            allCapturedPhotos = [];
            shootCounter.classList.remove('hidden');

            for (let i = 1; i <= 12; i++) {
                shootCounter.textContent = `Foto ke-${i} / 12`;
                await runCountdown();
                allCapturedPhotos.push(capturePhotoCanvas());
            }

            shootCounter.classList.add('hidden');
            setupSection.classList.add('hidden');
            showSelectionScreen();
        }

        function runCountdown() {
            return new Promise(resolve => {
                let count = 3;
                countdownEl.classList.remove('hidden');
                countdownEl.textContent = count;
                
                let timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownEl.textContent = count;
                    } else {
                        clearInterval(timer);
                        countdownEl.classList.add('hidden');
                        resolve();
                    }
                }, 1000);
            });
        }

        function capturePhotoCanvas() {
            let c = document.createElement('canvas');
            c.width = 640; c.height = 480;
            let context = c.getContext('2d');
            context.filter = document.getElementById('filter-select').value;
            context.translate(c.width, 0); 
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, c.width, c.height);
            return c;
        }

        function showSelectionScreen() {
            selectionSection.classList.remove('hidden');
            photosGrid.innerHTML = '';
            selectedIndices = [];
            
            let requiredCount = parseInt(layoutSelect.value);
            targetCountEl.textContent = requiredCount;

            allCapturedPhotos.forEach((photoCanvas, idx) => {
                let imgThumb = document.createElement('img');
                imgThumb.src = photoCanvas.toDataURL('image/png');
                imgThumb.className = "w-full aspect-[4/3] object-cover rounded-lg cursor-pointer border-2 border-transparent photo-card transition-all";
                imgThumb.onclick = () => toggleSelectPhoto(idx, imgThumb);
                photosGrid.appendChild(imgThumb);
            });
            validateSelection();
        }

        function toggleSelectPhoto(index, element) {
            let requiredCount = parseInt(layoutSelect.value);
            
            if (selectedIndices.includes(index)) {
                selectedIndices = selectedIndices.filter(i => i !== index);
                element.classList.remove('selected');
            } else {
                if (selectedIndices.length >= requiredCount) {
                    alert(`Maksimal hanya boleh memilih ${requiredCount} foto sesuai bingkai yang Anda tentukan!`);
                    return;
                }
                selectedIndices.push(index);
                element.classList.add('selected');
            }
            validateSelection();
        }

        function validateSelection() {
            let requiredCount = parseInt(layoutSelect.value);
            if (selectedIndices.length === requiredCount) {
                generateCollageBtn.disabled = false;
                generateCollageBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                generateCollageBtn.classList.add('pink-gradient', 'text-white', 'shadow-md', 'hover:opacity-90');
                generateCollageBtn.textContent = "Buat Kolase Sekarang ✨";
            } else {
                generateCollageBtn.disabled = true;
                generateCollageBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                generateCollageBtn.classList.remove('pink-gradient', 'text-white', 'shadow-md', 'hover:opacity-90');
                generateCollageBtn.textContent = `Pilih ${requiredCount - selectedIndices.length} foto lagi...`;
            }
        }

        function generateCollage() {
            selectionSection.classList.add('hidden');
            editArea.classList.remove('hidden');
            updatePreview();
        }

        function updatePreview() {
            if (selectedIndices.length === 0) return;

            const layoutCount = parseInt(layoutSelect.value);
            const bgColor = document.getElementById('bg-color-select').value;
            const accessory = document.getElementById('accessory-select').value;

            let canvasHeight = layoutCount === 8 ? 3200 : (layoutCount === 6 ? 2450 : 1850);
            canvas.width = 600; 
            canvas.height = canvasHeight;

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(30, 30, 540, canvas.height - 60);

            let yOffset = 60;
            let photoW = 480;
            let photoH = 360;
            let xOffset = 60;

            selectedIndices.forEach((photoIdx, i) => {
                let p = allCapturedPhotos[photoIdx];
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(xOffset, yOffset + (i * 380), photoW, photoH, 10);
                ctx.clip();
                ctx.drawImage(p, xOffset, yOffset + (i * 380), photoW, photoH);
                ctx.restore();
            });

            let textY = canvas.height - 130;
            ctx.fillStyle = "#db2777";
            ctx.font = "bold 22px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("✨ Photobooth By Tamz ✨", 300, textY);

            ctx.font = "14px 'Segoe UI'";
            ctx.fillStyle = "#888888";
            ctx.fillText("Special Memories • 2026", 300, textY + 35);

            if (accessory === 'ribbon') {
                ctx.font = "35px sans-serif";
                ctx.fillText("🎀", 70, 70);
                ctx.fillText("💖", 530, 480);
                ctx.fillText("✨", 530, 1200);
                ctx.fillText("🎀", 70, canvas.height - 70);
            } else if (accessory === 'stars') {
                ctx.font = "35px sans-serif";
                ctx.fillText("⭐", 70, 70);
                ctx.fillText("✨", 520, 500);
                ctx.fillText("💫", 520, 1300);
                ctx.fillText("⭐", 70, canvas.height - 70);
            } else if (accessory === 'flowers') {
                ctx.font = "35px sans-serif";
                ctx.fillText("🌸", 70, 70);
                ctx.fillText("🌷", 520, 500);
                ctx.fillText("🌸", 520, 1300);
                ctx.fillText("🌷", 70, canvas.height - 70);
            } else if (accessory === 'kiss') {
                ctx.font = "35px sans-serif";
                ctx.fillText("💋", 70, 70);
                ctx.fillText("💘", 520, 500);
                ctx.fillText("💋", 520, 1300);
                ctx.fillText("💘", 70, canvas.height - 70);
            }

            const dataUrl = canvas.toDataURL('image/png');
            finalImage.src = dataUrl;
            downloadLink.href = dataUrl;
            downloadLink.download = 'photobooth-by-tamz-pro.png';
        }

        function backToSelection() {
            editArea.classList.add('hidden');
            selectionSection.classList.remove('hidden');
        }

        function restartSession() {
            editArea.classList.add('hidden');
            selectionSection.classList.add('hidden');
            setupSection.classList.remove('hidden');
            startBtn.disabled = false;
            startBtn.textContent = "Mulai 12x Jepret Foto 📸";
            initCamera();
        }
    </script>
</body>
</html>
