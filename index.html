<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth By Tamz 🎀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fdf2f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .pink-gradient { background: linear-gradient(135deg, #fbcfe8, #f9a8d4); }
        
        /* Trik agar kamera terlihat lebih 'Wide' / Jauh secara visual */
        .video-box { 
            transform: scaleX(-1) scale(0.85);
            transform-origin: center;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white p-6 rounded-3xl shadow-2xl border-4 border-pink-200 text-center">
        <h1 class="text-3xl font-bold text-pink-500 mb-2 tracking-tight">Photobooth By Tamz ✨</h1>
        <p class="text-xs text-pink-400 mb-4">Abadikan momen serumu di sini!</p>
        
        <!-- Pilihan Kamera & Filter -->
        <div id="capture-controls" class="mb-3 text-left">
            <label class="block text-xs font-semibold text-pink-600 mb-1">Pilih Kamera:</label>
            <select id="camera-select" onchange="changeCamera()" class="w-full p-2.5 rounded-xl border border-pink-200 text-pink-600 bg-pink-50/50 text-sm focus:outline-none mb-2">
                <option value="">Mencari kamera...</option>
            </select>

            <label class="block text-xs font-semibold text-pink-600 mb-1">Pilih Filter Kamera:</label>
            <select id="filter-select" class="w-full p-2.5 rounded-xl border border-pink-200 text-pink-600 bg-pink-50/50 text-sm focus:outline-none">
                <option value="none">Normal (Natural)</option>
                <option value="sepia(40%)">Vintage Warm</option>
                <option value="grayscale(100%)">Classic B&W</option>
                <option value="brightness(110%) saturate(140%)">Cute Bright ✨</option>
            </select>
        </div>

        <!-- Area Kamera / Live Preview -->
        <div class="relative overflow-hidden rounded-2xl bg-gray-900 aspect-[3/4] mb-4 shadow-inner flex items-center justify-center">
            <video id="video" autoplay playsinline class="w-full h-full object-contain video-box"></video>
            <div id="countdown" class="absolute inset-0 flex items-center justify-center text-7xl font-black text-white drop-shadow-md hidden bg-pink-500/30 backdrop-blur-[2px]">3</div>
        </div>

        <!-- Tombol Mulai Foto -->
        <button id="start-btn" onclick="startPhotobooth()" class="w-full pink-gradient hover:opacity-90 text-white font-bold py-4 rounded-2xl transition shadow-lg text-lg">
            Mulai Foto (4 Pose) 📸
        </button>

        <!-- Area Sesi Edit & Pilih Bingkai -->
        <div id="edit-area" class="hidden mt-6 pt-4 border-t-2 border-pink-100 text-left">
            <h2 class="text-md font-bold text-pink-500 mb-3 text-center">Sesi Edit & Styling 🎨</h2>
            
            <div class="mb-3">
                <label class="block text-xs font-semibold text-pink-600 mb-1">Pilih Tema Bingkai:</label>
                <select id="theme-select" onchange="updatePreview()" class="w-full p-2.5 rounded-xl border border-pink-200 text-pink-600 bg-pink-50/50 text-sm focus:outline-none">
                    <option value="vintage">Brown Vintage (Ala Toko Buku)</option>
                    <option value="pastel">Soft Pink Pastel</option>
                    <option value="dark">Dark Aesthetic</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-xs font-semibold text-pink-600 mb-1">Tambah Asesoris/Stiker:</label>
                <select id="accessory-select" onchange="updatePreview()" class="w-full p-2.5 rounded-xl border border-pink-200 text-pink-600 bg-pink-50/50 text-sm focus:outline-none">
                    <option value="ribbon">Pita & Hati Lucu (🎀)</option>
                    <option value="stars">Bintang Berkilau (⭐)</option>
                    <option value="none">Tanpa Stiker</option>
                </select>
            </div>

            <div class="bg-pink-50 p-3 rounded-2xl border border-pink-200 mb-4 flex justify-center">
                <img id="final-image" class="max-h-80 rounded-xl shadow-md border border-pink-100">
            </div>

            <a id="download-link" class="block w-full bg-pink-500 text-white py-3 rounded-xl font-bold hover:bg-pink-600 transition shadow-md text-center mb-2">
                Download Hasil Foto 🎀
            </a>
            <button onclick="resetPhotobooth()" class="w-full text-xs text-pink-400 hover:text-pink-600 py-2 underline">
                Foto Ulang dari Awal
            </button>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('video');
        const countdownEl = document.getElementById('countdown');
        const startBtn = document.getElementById('start-btn');
        const editArea = document.getElementById('edit-area');
        const captureControls = document.getElementById('capture-controls');
        const cameraSelect = document.getElementById('camera-select');
        const finalImage = document.getElementById('final-image');
        const downloadLink = document.getElementById('download-link');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let capturedPhotos = [];
        let currentStream = null;

        async function getCameras() {
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                tempStream.getTracks().forEach(track => track.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                cameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Kamera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });

                if (videoDevices.length > 0) {
                    initCamera(videoDevices[0].deviceId);
                }
            } catch (err) {
                alert("Gagal mendeteksi kamera: " + err.message);
            }
        }

        async function initCamera(deviceId) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: { 
                        deviceId: deviceId ? { exact: deviceId } : undefined,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                console.error("Error opening camera:", err);
            }
        }

        function changeCamera() {
            initCamera(cameraSelect.value);
        }

        getCameras();

        async function startPhotobooth() {
            startBtn.disabled = true;
            startBtn.textContent = "Bersiap ya... 💖";
            editArea.classList.add('hidden');
            
            capturedPhotos = [];
            for (let i = 0; i < 4; i++) {
                await runCountdown();
                capturedPhotos.push(capturePhoto());
            }

            updatePreview();
            startBtn.disabled = false;
            startBtn.textContent = "Mulai Foto (4 Pose) 📸";
            editArea.classList.remove('hidden');
            editArea.scrollIntoView({ behavior: 'smooth' });
        }

        function runCountdown() {
            return new Promise(resolve => {
                let count = 3;
                countdownEl.classList.remove('hidden');
                countdownEl.textContent = count;
                
                let timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownEl.textContent = count;
                    } else {
                        clearInterval(timer);
                        countdownEl.classList.add('hidden');
                        resolve();
                    }
                }, 1000);
            });
        }

        function capturePhoto() {
            let c = document.createElement('canvas');
            c.width = 640; c.height = 480;
            let context = c.getContext('2d');
            context.filter = document.getElementById('filter-select').value;
            context.translate(c.width, 0); 
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, c.width, c.height);
            return c;
        }

        function updatePreview() {
            if (capturedPhotos.length === 0) return;

            const theme = document.getElementById('theme-select').value;
            const accessory = document.getElementById('accessory-select').value;

            canvas.width = 600; 
            canvas.height = 1850;

            if (theme === 'vintage') {
                ctx.fillStyle = "#3e2723"; 
            } else if (theme === 'pastel') {
                ctx.fillStyle = "#fff1f2"; 
            } else {
                ctx.fillStyle = "#18181b"; 
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let yOffset = 50;
            let photoW = 520;
            let photoH = 390;
            let xOffset = 40;

            capturedPhotos.forEach((p, i) => {
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(xOffset, yOffset + (i * 420), photoW, photoH, 15);
                ctx.clip();
                ctx.drawImage(p, xOffset, yOffset + (i * 420), photoW, photoH);
                ctx.restore();
            });

            ctx.fillStyle = (theme === 'vintage') ? "#d7ccc8" : (theme === 'dark') ? "#f43f5e" : "#ec4899";
            ctx.font = "bold 22px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("✨ Photobooth By Tamz ✨", 300, 1780);

            ctx.font = "14px 'Segoe UI'";
            ctx.fillStyle = (theme === 'vintage') ? "#a1887f" : "#888888";
            ctx.fillText("Special Memories • 2026", 300, 1810);

            if (accessory === 'ribbon') {
                ctx.font = "30px sans-serif";
                ctx.fillText("🎀", 80, 80);
                ctx.fillText("💖", 520, 500);
                ctx.fillText("🎀", 80, 920);
            } else if (accessory === 'stars') {
                ctx.font = "30px sans-serif";
                ctx.fillText("⭐", 70, 70);
                ctx.fillText("✨", 510, 480);
                ctx.fillText("💫", 510, 1320);
            }

            const dataUrl = canvas.toDataURL('image/png');
            finalImage.src = dataUrl;
            downloadLink.href = dataUrl;
            downloadLink.download = 'photobooth-by-tamz.png';
        }

        function resetPhotobooth() {
            editArea.classList.add('hidden');
        }
    </script>
</body>
</html>
